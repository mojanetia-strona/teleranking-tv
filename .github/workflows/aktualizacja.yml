name: Cotygodniowa aktualizacja bazy TV

on:
  schedule:
    - cron: "17 4 * * 1"   # poniedziałek ok. 6:17 czasu polskiego (zimą 5:17)
  workflow_dispatch:
    inputs:
      only:
        description: "Tylko wybrani operatorzy (slugi po przecinku, np. netia,vectra). Puste = wszyscy."
        required: false
        default: ""
      force:
        description: "Sprawdź przez AI nawet jeśli strony operatorów się nie zmieniły (tak/nie)"
        required: false
        default: "nie"
      tylko_hashe:
        description: "Tylko zapamiętaj obecny stan stron operatorów, bez AI (tak/nie)"
        required: false
        default: "nie"

permissions:
  contents: write

concurrency:
  group: aktualizacja
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=0.70" pypdf
      - name: Aktualizacja danych
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
          TYLKO_HASHE: ${{ github.event.inputs.tylko_hashe }}
        run: python scripts/update.py
      - name: Zapis zmian
        if: always()
        run: |
          git config user.name "teleranking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aktualizacja bazy TV $(date +%F)" && (git push || (git pull --rebase && git push)))
